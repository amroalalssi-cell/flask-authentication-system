<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two-Factor Authentication</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/two_factor.css') }}">
</head>
<body>

<div class="form">
    <div class="container">
        <!-- الصورة + المحتوى على اليسار -->
        <div class="left">
            <img src="{{ url_for('static', filename='images/imag.jpg') }}">   
            <h2>Two-Factor Authentication</h2>
            <p>Enter the 6-digit code sent to your email</p>
        </div>
 
        <!-- الفورم على اليمين ملاصق للصورة -->
        <div class="right">
            <form>
                <div class="otp">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                </div>
                <button type="submit">Confirm</button>
                <p class="resend">Resend code in <span class="timer">30</span>s</p>
            </form>
        </div>
    </div>
</div>

</body>
</html>
