<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <div class="form-card">

        <div class="container">

            <!-- Left Side -->
            <div class="left">

                <div class="logo">
                    <img src="{{ url_for('static', filename='images/imag.jpg') }}" 
                        alt="Logo">
                </div>

                <h2>Welcome Back</h2>

            </div>


            <!-- Right Side -->
            <div class="right">

                <form method="POST">

                    <div class="input-group">
                        <input 
                            type="email" 
                            name="email"
                            placeholder="Email"
                            required>
                    </div>


                    <div class="input-group password">

                        <input 
                            type="password"
                            name="password"
                            placeholder="Password"
                            required>

                        <button type="button" class="toggle">
                            👁
                        </button>

                    </div>


                    <button type="submit">
                        Login
                    </button>


                    <div class="links">

                        <a href="{{ url_for('auth.forgot_password') }}">
                            Forgot Password?
                        </a>

                        <p>
                            Don't have an account?
                        </p>

                        <a href="{{ url_for('auth.register') }}">
                            Register
                        </a>

                    </div>


                </form>

            </div>

        </div>

    </div>


<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
