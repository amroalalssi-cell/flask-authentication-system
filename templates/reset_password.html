<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/reset_password.css') }}"></head>
<body>
 
<div class="form">
    <div class="container">
        <div class="left">
<img src="{{ url_for('static', filename='images/imag.jpg') }}">   
     <h2>إعادة تعيين كلمة المرور</h2>
            <p>الرجاء إدخال كلمة المرور الجديدة لتحديث حسابك.</p>
        </div>
        <div class="right">
            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">

                <div class="password">

                    <input 
                        type="password"
                        name="password"
                        placeholder="New Password"
                        required>

                </div>


                <button type="submit">
                    Save Password
                </button>


            </form>
        </div>
    </div>
</div>
</body>
</html>
