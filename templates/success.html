<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Success</title>
    <!-- ربط ملفات الـ CSS الخاصة بمشروعك لتجعل التصميم متناسقاً -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <div class="form-card">
        <div class="container" style="flex-direction: column; justify-content: center; padding: 40px;">
            
            <div style="font-size: 50px; color: #4CAF50; margin-bottom: 20px;">✓</div>
            
            <h2 style="margin-bottom: 10px;">User Created Successfully!</h2>
            <p style="color: #666; margin-bottom: 30px; text-align: center;">
                Your account has been securely created and password encrypted.
            </p>

            <!-- زر ينقله لصفحة تسجيل الدخول -->
            <a href="{{ url_for('auth.login') }}" class="submit-btn" style="text-align: center; text-decoration: none; display: inline-block; width: 100%; max-width: 200px; background-color: #4CAF50; color: white; padding: 12px; border-radius: 6px;">
                Go to Login
            </a>

        </div>
    </div>

</body>
</html>
